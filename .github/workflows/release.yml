name: Build & Release CookieRun Bot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g. v2.1.8) - Leave empty to use version from src/version.py'
        required: false
        default: ''
      use_nuitka:
        description: '🛡️ Use Nuitka C++ Compiler (Slow ~15m) instead of Fast PyInstaller (~2m)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CCACHE_DIR: C:\ccache
  CCACHE_MAXSIZE: 3G

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: ⚡ Cache Nuitka & Ccache C++ objects
        uses: actions/cache@v4
        with:
          path: |
            C:\ccache
            C:\Users\runneradmin\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-cache-win-${{ hashFiles('src/requirements.txt', 'build_exe.py') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-cache-win-${{ hashFiles('src/requirements.txt', 'build_exe.py') }}-
            nuitka-cache-win-

      - name: 📦 Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: 📦 Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r src/requirements.txt
          python -m pip install nuitka zstandard pyinstaller

      - name: ⚛️ Build React Frontend
        shell: pwsh
        run: |
          if (Test-Path "frontend/package.json") {
            Write-Host "Building React frontend..."
            cd frontend
            npm install --prefer-offline --no-audit
            npm run build
            cd ..
          } else {
            Write-Host "No frontend/package.json found, skipping."
          }

      - name: 🔍 Resolve Version from Git Tag
        id: get_tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version_tag }}" -ne "") {
            $tag = "${{ github.event.inputs.version_tag }}"
          }
          if ($tag -match "^v?(\d+\.\d+\.\d+)") {
            $clean_ver = $Matches[1]
            Write-Host "Syncing version in src/version.py to $clean_ver..."
            (Get-Content "src/version.py") -replace 'CURRENT_VERSION\s*=\s*"[^"]*"', "CURRENT_VERSION = `"$clean_ver`"" | Set-Content "src/version.py"
            $tag = "v$clean_ver"
          } else {
            $ver = python -c "import sys; sys.path.insert(0, 'src'); from version import CURRENT_VERSION; print(CURRENT_VERSION)"
            $tag = "v$ver"
          }
          Write-Host "Resolved Release Tag: $tag"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

          # Generate dynamic release body from version.json
          python src/generate_release_notes.py "$tag"

      - name: 🔨 Build Executable & Windows Installer
        shell: pwsh
        run: |
          $flags = @("--force-rebuild")
          if ("${{ github.event.inputs.use_nuitka }}" -eq "true") {
            Write-Host "🛡️ Nuitka C++ compilation mode requested."
          } else {
            Write-Host "⚡ Fast Build mode (PyInstaller - 2 mins) enabled by default!"
            $flags += "--fast"
          }
          python build_installer.py @flags

      - name: 🚀 Publish GitHub Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CookieRun Bot Pro ${{ env.RELEASE_TAG }}
          files: dist_installer/*.exe
          body_path: release_body.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
